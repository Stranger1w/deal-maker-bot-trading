# Despliegue en la nube (Cloudflare Workers).
#
# QUE ES
# El motor de la app necesita correr 24/7 en algun sitio con URL publica (tu
# PC no sirve si lo apagas). Esta configuracion publica la app como un
# Worker de Cloudflare: es lo que nitro genera por defecto cuando NO se
# compila para escritorio (preset cloudflare_module).
#
# COMO USARLO (una vez, en tu terminal)
#   bunx wrangler login          # abres el navegador y entras en tu cuenta
#   bun run deploy:cloud         # compila y publica
#
# Te dara una URL tipo https://deal-maker.<tu-usuario>.workers.dev
# Esa URL es la que necesita el cron (ver PARA-TI.md, seccion 5).
#
# OJO
# El Worker necesita las variables de entorno (SUPABASE_URL, las claves, etc.).
# Se secretan con: bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# (y las demas que needs). NO las pongas en este fichero.
#
# LIMITES VERIFICADOS (docs de Cloudflare, oct-2026)
#   Plan gratis : 100.000 peticiones/dia, 10 ms de CPU por peticion Y POR CADA
#                 CRON TRIGGER, 128 MB, 5 cron triggers por cuenta.
#   Plan de pago : sin limite de peticiones, 5 min de CPU por peticion y
#                 30 s por cron trigger, 10.000 subrequests, 250 crons.
#
#   OJO con los 10 ms del plan gratis: el motor de TRADING casi todo es
#   llamadas de red (que no cuentan como CPU), pero el benchmark de mineria
#   (SHA-256 de verdad) es CPU pura y NO cabe en 10 ms. Por eso el cron de
#   mineria se queda en tu PC (la app de escritorio) y el de trading puede
#   ir en la nube.
#
# CRON: aqui NO se pone a proposito. Un cron trigger de Cloudflare llama al
# handler "scheduled" del Worker, y esta app (nitro + tanstack start) no lo
# exporta: el disparo se quedaria en un 404. Para el cron usa una de estas
# dos, que si funcionan:
#   a) La tarea de Windows de tu PC (scripts/instalar-cron-local.ps1) -> cada
#      minuto, de verdad.
#   b) El workflow de GitHub Actions (.github/workflows/tick.yml) -> cada 5
#      minutos (es el minimo de GitHub) y puede retrasarse o caerse alguna
#      ejecucion: sirve de RESPALDO, no de motor principal.
#   c) Un cron propio en la nube (Railway/VPS) que llame a
#      POST /api/public/automation-tick con el secreto: cada minuto, sin
#      retardos. Es la opcion para 24/7 de verdad.

name = "deal-maker"
main = ".output/server/index.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Los ficheros estaticos que genera nitro (.output/public).
[assets]
directory = ".output/public"
binding = "ASSETS"
