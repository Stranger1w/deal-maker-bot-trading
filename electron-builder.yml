appId: dev.dealmaker.desktop
productName: Deal Maker
copyright: Deal Maker
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/**
  - package.json
asar: true
asarUnpack:
  - dist/server/**
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: DealMaker-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Deal Maker
  uninstallDisplayName: Deal Maker
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.finance
  artifactName: DealMaker-${version}-${arch}.${ext}
dmg:
  title: Deal Maker
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
linux:
  target: [AppImage]
  icon: build/icon.png
  category: Finance
