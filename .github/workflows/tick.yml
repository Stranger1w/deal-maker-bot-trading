name: Motor Deal Maker

# Llama al endpoint del motor para que avance un ciclo.
#
# QUE ES Y QUE NO ES
# El motor de trading vive en el servidor de la app (POST
# /api/public/automation-tick, con cabecera Authorization: Bearer <secreto>).
# Este workflow NO es el motor: es un reloj que lo llama.
#
# LIMITES VERIFICADOS (docs de GitHub, oct-2026)
#   - "The shortest interval you can run scheduled workflows is once every
#     5 minutes" -> de ahi el */5 de abajo.
#   - "The schedule event can be delayed during periods of high loads...
#     some queued jobs may be dropped" -> puede retrasarse o caerse.
#   - En un repositorio publico, los workflows programados se desactivan
#     solos si no hay actividad en 60 dias.
#   - Solo se ejecutan en la rama por defecto.
#
# O sea: esto es un RESPALDO (cada 5 minutos, a veces con retraso), no un
# motor de minuto. Para el minuto de verdad, la opcion B de PARA-TI.md: un
# cron propio en la nube que llame al endpoint.
#
# COMO SE USA
# 1) En el repo: Settings -> Secrets and variables -> Actions -> New
#    repository secret:
#       DEAL_MAKER_URL       = https://tu-dominio/api/public/automation-tick
#       DEAL_MAKER_CRON_KEY  = (el valor de LOVABLE_CRON_SECRET)
# 2) Da al boton "Run workflow" para probarlo a mano.

on:
  workflow_dispatch:
  schedule:
    # Cada 5 minutos (GitHub retrasa los programados: en el plan gratuito
    # pueden pasar minutos o, en el peor caso, una hora).
    - cron: "*/5 * * * *"

concurrency:
  group: motor-deal-maker
  cancel-in-progress: false

jobs:
  tick:
    name: Un ciclo del motor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar configuracion
        id: config
        env:
          DEAL_MAKER_URL: ${{ secrets.DEAL_MAKER_URL }}
          DEAL_MAKER_CRON_KEY: ${{ secrets.DEAL_MAKER_CRON_KEY }}
        run: |
          if [ -z "$DEAL_MAKER_URL" ] || [ -z "$DEAL_MAKER_CRON_KEY" ]; then
            echo "::error::Faltan los secretos DEAL_MAKER_URL y DEAL_MAKER_CRON_KEY"
            exit 1
          fi

      - name: Llamar al motor
        env:
          DEAL_MAKER_URL: ${{ secrets.DEAL_MAKER_URL }}
          DEAL_MAKER_CRON_KEY: ${{ secrets.DEAL_MAKER_CRON_KEY }}
        run: |
          respuesta=$(curl -sS -X POST \
            -H "Authorization: Bearer $DEAL_MAKER_CRON_KEY" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            "$DEAL_MAKER_URL" 2>&1) || {
            echo "::error::No se pudo llamar al motor"
            exit 1
          }
          codigo=$(printf "%s" "$respuesta" | tail -n1)
          cuerpo=$(printf "%s" "$respuesta" | sed '$d')
          echo "HTTP $codigo"
          echo "$cuerpo"
          if [ "$codigo" != "200" ]; then
            echo "::error::El motor respondio $codigo"
            exit 1
          fi

      - name: Llamar al motor de mineria
        env:
          DEAL_MAKER_URL: ${{ secrets.DEAL_MAKER_URL }}
          DEAL_MAKER_CRON_KEY: ${{ secrets.DEAL_MAKER_CRON_KEY }}
        run: |
          # El enjambre de mineria (mide el hash rate real). Si falla, el
          # trading sigue: por eso este paso no rompe el workflow.
          url="${DEAL_MAKER_URL%/automation-tick}/mining-tick"
          codigo=$(curl -sS -X POST \
            -H "Authorization: Bearer $DEAL_MAKER_CRON_KEY" \
            -o /tmp/mining.json -w "%{http_code}" \
            "$url" 2>&1) || {
            echo "::warning::No se pudo llamar al motor de mineria"
            exit 0
          }
          echo "HTTP $codigo"
          cat /tmp/mining.json || true
          if [ "$codigo" != "200" ]; then
            echo "::warning::El motor de mineria respondio $codigo"
          fi
